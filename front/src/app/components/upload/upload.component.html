<div class="card upload">
  <textarea
    #ta
    rows="5"
    [value]="text"
    (input)="textChange.emit(ta.value)"
    placeholder="Pega o sube tu documento .txt o .pdf biomédico aquí…">
  </textarea>

  <div class="actions">
    <label class="attach" title="Cargar archivos">
      <!-- ícono clip -->
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 13l5-5a3 3 0 114 4l-7 7a5 5 0 11-7-7l8-8" fill="none" stroke="currentColor" stroke-width="2"/>
      </svg>
      <input type="file" accept=".txt,.pdf" (change)="onFile($event)" hidden>
    </label>

    <button class="btn" (click)="generate.emit()">Generar Resumen</button>
  </div>
</div>
