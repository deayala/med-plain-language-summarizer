<!-- ===== Variante: Gauge (Readability mejorada) ===== -->
<div *ngIf="variant === 'gauge'" class="readability-card">

  <div class="readability-left">
    <!-- Gauge -->
    <div class="gauge">
      <div class="gauge-circle" [style.border-color]="ringColor">
        <div class="gauge-value">{{ value | number:'1.0-0' }}%</div>
      </div>
    </div>

    <!-- Texto interpretativo -->
    <div class="readability-text">
      <div class="readability-strong">
        {{ note.split('·')[0].trim() }}
      </div>
      <div class="readability-sub">
        {{ note.split('·')[1]?.trim() }}
      </div>
    </div>
  </div>

  <!-- Valores Inicial / Generado -->
  <div class="readability-right">
    <div class="read-row">
      <span>Inicial</span>
      <span class="val">{{ initial | number:'1.2-2' }}</span>
    </div>
    <div class="read-row">
      <span>Generado</span>
      <span class="val">{{ generated | number:'1.2-2' }}</span>
    </div>
  </div>

</div>
