services:
  api:
    image: ${API_IMAGE_URI:?set API_IMAGE_URI}
    restart: always
    environment:
      HF_ENDPOINT_URL: ${HF_ENDPOINT_URL:?set HF_ENDPOINT_URL}
      HF_TOKEN: ${HF_TOKEN:?set HF_TOKEN}
      DRY_RUN: ${DRY_RUN:-0}
    ports:
      - "80:80"
  alignscore:
    image: ${ALIGNSCORE_IMAGE_URI:?set ALIGNSCORE_IMAGE_URI}
    restart: always
    environment:
      ALIGN_MODEL_NAME: ${ALIGN_MODEL_NAME:-roberta-base}
      ALIGN_BATCH_SIZE: ${ALIGN_BATCH_SIZE:-4}
      ALIGN_DEVICE_PREFERENCE: ${ALIGN_DEVICE_PREFERENCE:-auto}
      ALIGN_CHECKPOINT_PATH: ${ALIGN_CHECKPOINT_PATH:-/assets/AlignScore-base.ckpt}
    volumes:
      - "${ALIGN_CHECKPOINT_HOST_PATH:?set ALIGN_CHECKPOINT_HOST_PATH}:${ALIGN_CHECKPOINT_PATH:-/assets/AlignScore-base.ckpt}:ro"
    ports:
      - "${ALIGNSCORE_HOST_PORT:-8443}:8090"
